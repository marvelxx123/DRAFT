<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Studio — WEARIT</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dancing+Script:wght@400;700&family=Inter:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700;900&family=Nunito:wght@400;700&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600;700&family=Raleway:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/editor.css" />

  <!-- Fabric.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body class="tool-select">

<div id="app">

  <!-- ══════════════════════════════════════════════════════
       TOP BAR
  ═══════════════════════════════════════════════════════════ -->
  <header id="topbar">

    <!-- Logo -->
    <a href="/" class="tb-logo">WEAR<span>IT</span></a>

    <div class="tb-divider"></div>

    <!-- Product picker -->
    <div class="tb-product-picker">
      <button id="productPickerBtn" onclick="toggleProductDropdown()">
        <span id="productPickerEmoji">👕</span>
        <span id="productPickerName">T-Shirt</span>
        <span class="chevron">▾</span>
      </button>
      <div class="product-dropdown" id="productDropdown">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Surface tabs -->
    <div class="tb-surface-tabs" id="surfaceTabs">
      <!-- Populated by JS -->
    </div>

    <div class="tb-spacer"></div>

    <!-- Undo / Redo -->
    <div class="tb-group">
      <button class="tb-btn" id="undoBtn" onclick="undo()" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
      </button>
      <button class="tb-btn" id="redoBtn" onclick="redo()" title="Redo (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
        </svg>
      </button>
    </div>

    <div class="tb-divider"></div>

    <!-- Zoom -->
    <div class="tb-group zoom-display">
      <button class="tb-btn" onclick="zoomOut()" title="Zoom Out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <span id="zoomLabel">100%</span>
      <button class="tb-btn" onclick="zoomIn()" title="Zoom In">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="tb-btn" onclick="fitZoom()" title="Fit to screen" style="font-size:11px;font-weight:700;color:#94a3b8;width:auto;padding:0 6px;">FIT</button>
    </div>

    <div class="tb-divider"></div>

    <!-- Download -->
    <button class="tb-action tb-download" onclick="downloadPNG()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>

    <!-- Add to Cart -->
    <button class="tb-action tb-cart" id="cartBtn" onclick="addToCart()">
      Add to Cart &middot; <span id="cartPrice">$24.99</span>
    </button>

  </header>

  <!-- ══════════════════════════════════════════════════════
       MAIN AREA
  ═══════════════════════════════════════════════════════════ -->
  <div id="main">

    <!-- ── LEFT TOOLBAR ──────────────────────────────────── -->
    <nav id="toolbar">

      <button class="tool-btn active" data-tool="select" data-tip="Select (V)" onclick="setTool('select')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2l16 8.5-8 2-3 8z"/></svg>
        <span class="tool-label">Select</span>
      </button>

      <button class="tool-btn" data-tool="text" data-tip="Text (T)" onclick="setTool('text')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="12" y1="6" x2="12" y2="20"/></svg>
        <span class="tool-label">Text</span>
      </button>

      <div class="tool-sep"></div>

      <button class="tool-btn" data-tool="rect" data-tip="Rectangle (R)" onclick="setTool('rect')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
        <span class="tool-label">Rect</span>
      </button>

      <button class="tool-btn" data-tool="circle" data-tip="Circle (C)" onclick="setTool('circle')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
        <span class="tool-label">Circle</span>
      </button>

      <button class="tool-btn" data-tool="triangle" data-tip="Triangle" onclick="setTool('triangle')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L22 20H2L12 3z"/></svg>
        <span class="tool-label">Tri</span>
      </button>

      <button class="tool-btn" data-tool="star" data-tip="Star" onclick="setTool('star')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.8.6-5 4.7 1.5 6.8L12 17l-6.2 3.4 1.5-6.8-5-4.7 6.8-.6z"/></svg>
        <span class="tool-label">Star</span>
      </button>

      <button class="tool-btn" data-tool="line" data-tip="Line" onclick="setTool('line')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="21" x2="21" y2="3"/></svg>
        <span class="tool-label">Line</span>
      </button>

      <div class="tool-sep"></div>

      <button class="tool-btn" data-tool="image" data-tip="Upload Image" onclick="triggerImageUpload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span class="tool-label">Image</span>
      </button>

      <button class="tool-btn" data-tool="draw" data-tip="Freehand Draw (D)" onclick="setTool('draw')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 17l6-6 4 4 6-8 4 5"/></svg>
        <span class="tool-label">Draw</span>
      </button>

      <div class="tool-sep"></div>

      <button class="tool-btn" data-tool="templates" data-tip="Templates" onclick="openPanel('templates')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="tool-label">Tmplt</span>
      </button>

      <button class="tool-btn" data-tool="clipart" data-tip="Clipart" onclick="openPanel('clipart')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9c0-1.7 1.3-3 3-3s3 1.3 3 3-1.3 3-3 3"/><line x1="12" y1="15" x2="12" y2="17"/></svg>
        <span class="tool-label">Art</span>
      </button>

    </nav>

    <!-- ── SLIDE PANEL ───────────────────────────────────── -->
    <div id="slidePanel">
      <div class="sp-header">
        <h3 id="slidePanelTitle">Templates</h3>
        <button class="sp-close" onclick="closePanel()">&#10005;</button>
      </div>
      <div class="sp-body" id="slidePanelBody">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- ── STAGE ─────────────────────────────────────────── -->
    <div id="stage">
      <div id="canvasWrapper">
        <div id="mockupShape"></div>
        <canvas id="designCanvas"></canvas>
      </div>
    </div>

    <!-- ── PROPERTIES PANEL ──────────────────────────────── -->
    <aside id="propPanel">
      <div class="pp-scroll" id="ppScroll">

        <!-- === NO SELECTION: Product props === -->
        <div id="ppNoSelection">

          <!-- Product Color -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Product Color <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="swatch-grid" id="productSwatches"></div>
              <div class="pp-row">
                <label class="pp-label pp-label-wide">Custom</label>
                <input type="color" class="pp-color" id="productColorCustom" value="#ffffff" oninput="setProductColor(this.value); document.getElementById('productColorHex').value=this.value" />
                <input type="text" class="pp-input" id="productColorHex" value="#ffffff" style="width:80px;flex:none" onchange="setProductColor(this.value); document.getElementById('productColorCustom').value=this.value" maxlength="7" />
              </div>
            </div>
          </div>

          <!-- Canvas Background -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Canvas Background <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-row">
                <label class="pp-label pp-label-wide">Color</label>
                <input type="color" class="pp-color" id="canvasBgColor" value="#ffffff" oninput="setCanvasBg(this.value)" />
                <button class="pp-btn" onclick="setCanvasBg('transparent')" style="font-size:11px">Transparent</button>
              </div>
            </div>
          </div>

        </div>

        <!-- === SELECTION: Object props === -->
        <div id="ppSelection" style="display:none">

          <!-- Position & Size -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Position &amp; Size <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-row">
                <span class="pp-label">X</span>
                <input type="number" class="pp-input pp-input-sm" id="ppX" oninput="applyTransform()" />
                <span class="pp-label" style="margin-left:4px">Y</span>
                <input type="number" class="pp-input pp-input-sm" id="ppY" oninput="applyTransform()" />
              </div>
              <div class="pp-row">
                <span class="pp-label">W</span>
                <input type="number" class="pp-input pp-input-sm" id="ppW" oninput="applyTransform()" />
                <span class="pp-label" style="margin-left:4px">H</span>
                <input type="number" class="pp-input pp-input-sm" id="ppH" oninput="applyTransform()" />
              </div>
              <div class="pp-row">
                <span class="pp-label">Rot</span>
                <input type="number" class="pp-input" id="ppRot" oninput="applyTransform()" />
                <span class="pp-val">&#176;</span>
              </div>
            </div>
          </div>

          <!-- Fill -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Fill <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-row">
                <div class="pp-color-wrap">
                  <input type="color" class="pp-color" id="ppFill" oninput="applyFill(); document.getElementById('ppFillHex').value=this.value" />
                  <input type="text" class="pp-input" id="ppFillHex" style="max-width:90px" onchange="syncColorFromHex('ppFill','ppFillHex'); applyFill();" maxlength="7" />
                </div>
                <button class="pp-btn" onclick="applyNoFill()">No Fill</button>
              </div>
            </div>
          </div>

          <!-- Stroke -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Stroke <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-row">
                <input type="color" class="pp-color" id="ppStroke" oninput="applyStroke(); document.getElementById('ppStrokeHex').value=this.value" />
                <input type="text" class="pp-input" id="ppStrokeHex" style="max-width:90px" onchange="syncColorFromHex('ppStroke','ppStrokeHex'); applyStroke();" maxlength="7" />
              </div>
              <div class="pp-row">
                <span class="pp-label pp-label-wide">Width</span>
                <input type="range" class="pp-slider" id="ppStrokeW" min="0" max="20" value="0" oninput="applyStroke(); document.getElementById('ppStrokeWVal').textContent=this.value+'px'" />
                <span class="pp-val" id="ppStrokeWVal">0px</span>
              </div>
            </div>
          </div>

          <!-- Opacity -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Opacity <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-row">
                <input type="range" class="pp-slider" id="ppOpacity" min="0" max="100" value="100" oninput="applyOpacity(); document.getElementById('ppOpacityVal').textContent=this.value+'%'" />
                <span class="pp-val" id="ppOpacityVal">100%</span>
              </div>
            </div>
          </div>

          <!-- Text (shown only for text objects) -->
          <div class="pp-section" id="ppTextSection" style="display:none">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Text <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-row">
                <select class="pp-select" id="ppFontFamily" onchange="applyTextProps()">
                  <option value="Inter" style="font-family:Inter">Inter</option>
                  <option value="Roboto" style="font-family:Roboto">Roboto</option>
                  <option value="Open Sans" style="font-family:'Open Sans'">Open Sans</option>
                  <option value="Poppins" style="font-family:Poppins">Poppins</option>
                  <option value="Montserrat" style="font-family:Montserrat">Montserrat</option>
                  <option value="Lato" style="font-family:Lato">Lato</option>
                  <option value="Nunito" style="font-family:Nunito">Nunito</option>
                  <option value="Oswald" style="font-family:Oswald">Oswald</option>
                  <option value="Raleway" style="font-family:Raleway">Raleway</option>
                  <option value="Playfair Display" style="font-family:'Playfair Display'">Playfair Display</option>
                  <option value="Anton" style="font-family:Anton">Anton</option>
                  <option value="Bebas Neue" style="font-family:'Bebas Neue'">Bebas Neue</option>
                  <option value="Pacifico" style="font-family:Pacifico">Pacifico</option>
                  <option value="Dancing Script" style="font-family:'Dancing Script'">Dancing Script</option>
                  <option value="Georgia" style="font-family:Georgia">Georgia</option>
                  <option value="Impact" style="font-family:Impact">Impact</option>
                  <option value="Courier New" style="font-family:'Courier New'">Courier New</option>
                  <option value="Arial Black" style="font-family:'Arial Black'">Arial Black</option>
                  <option value="Arial" style="font-family:Arial">Arial</option>
                  <option value="Verdana" style="font-family:Verdana">Verdana</option>
                  <option value="Trebuchet MS" style="font-family:'Trebuchet MS'">Trebuchet MS</option>
                </select>
              </div>
              <div class="pp-row">
                <span class="pp-label pp-label-wide">Size</span>
                <input type="number" class="pp-input" id="ppFontSize" min="6" max="400" oninput="applyTextProps()" />
                <span class="pp-val">px</span>
              </div>
              <div class="pp-row">
                <span class="pp-label pp-label-wide">Color</span>
                <input type="color" class="pp-color" id="ppTextColor" oninput="applyTextColor()" />
              </div>
              <div class="pp-row">
                <div class="pp-btn-group" style="width:100%">
                  <button class="pp-btn" id="ppBold" onclick="toggleTextStyle('bold')"><b>B</b></button>
                  <button class="pp-btn" id="ppItalic" onclick="toggleTextStyle('italic')"><i>I</i></button>
                  <button class="pp-btn" id="ppUnderline" onclick="toggleTextStyle('underline')"><u>U</u></button>
                </div>
              </div>
              <div class="pp-row">
                <div class="pp-btn-group" style="width:100%">
                  <button class="pp-btn" id="ppAlignLeft" onclick="applyTextAlign('left')">&#8676; L</button>
                  <button class="pp-btn" id="ppAlignCenter" onclick="applyTextAlign('center')">&#8677; C</button>
                  <button class="pp-btn" id="ppAlignRight" onclick="applyTextAlign('right')">R &#8677;</button>
                </div>
              </div>
              <div class="pp-row">
                <span class="pp-label pp-label-wide">Line H</span>
                <input type="range" class="pp-slider" id="ppLineH" min="80" max="300" value="120" oninput="applyTextProps(); document.getElementById('ppLineHVal').textContent=(this.value/100).toFixed(1)" />
                <span class="pp-val" id="ppLineHVal">1.2</span>
              </div>
              <div class="pp-row">
                <span class="pp-label pp-label-wide">Spacing</span>
                <input type="range" class="pp-slider" id="ppLetterS" min="-50" max="300" value="0" oninput="applyTextProps(); document.getElementById('ppLetterSVal').textContent=(this.value/10).toFixed(1)" />
                <span class="pp-val" id="ppLetterSVal">0</span>
              </div>
            </div>
          </div>

          <!-- Layer Order -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Layer Order <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-btn-group">
                <button class="pp-btn" onclick="layerOp('front')" title="Bring to Front">&#8679;&#8679;</button>
                <button class="pp-btn" onclick="layerOp('up')" title="Forward">&#8679;</button>
                <button class="pp-btn" onclick="layerOp('down')" title="Backward">&#8681;</button>
                <button class="pp-btn" onclick="layerOp('back')" title="Send to Back">&#8681;&#8681;</button>
              </div>
            </div>
          </div>

          <!-- Align to Canvas -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Align to Canvas <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">
                <button class="pp-btn" onclick="alignObj('left')">&#8592; L</button>
                <button class="pp-btn" onclick="alignObj('hcenter')">&#8596; H</button>
                <button class="pp-btn" onclick="alignObj('right')">R &#8594;</button>
                <button class="pp-btn" onclick="alignObj('top')">&#8593; T</button>
                <button class="pp-btn" onclick="alignObj('vcenter')">&#8597; V</button>
                <button class="pp-btn" onclick="alignObj('bottom')">B &#8595;</button>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="pp-section">
            <div class="pp-section-head" onclick="toggleSection(this)">
              Actions <span class="pp-chevron">&#9660;</span>
            </div>
            <div class="pp-body">
              <div class="pp-btn-group">
                <button class="pp-btn" onclick="duplicateSelected()">Duplicate</button>
                <button class="pp-btn danger" onclick="deleteSelected()">Delete</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </aside>

  </div><!-- /#main -->

</div><!-- /#app -->

<!-- Hidden image upload input -->
<input type="file" id="imageUploadInput" accept="image/*" style="display:none" onchange="onImageUpload(event)" />

<!-- Toast -->
<div id="toast"></div>

<script src="js/editor.js"></script>
</body>
</html>
