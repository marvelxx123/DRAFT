<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | WEARIT</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --neon:       #e8ff00;
      --neon-dim:   rgba(232,255,0,.1);
      --neon-glow:  rgba(232,255,0,.25);
      --black:      #000;
      --black-2:    #080808;
      --black-3:    #101010;
      --border:     #2a2a2a;
      --text:       #f0f0f0;
      --text-muted: #888;
      --font-head:  'Bebas Neue', 'Impact', sans-serif;
      --font-sub:   'Oswald', sans-serif;
      --font-body:  'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* ── Grid background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .35;
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    .e-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: rgba(0,0,0,.85);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .e-logo {
      font-family: var(--font-head);
      font-size: 1.6rem;
      letter-spacing: .06em;
      color: var(--text);
      text-decoration: none;
    }
    .e-logo span { color: var(--neon); }

    /* ── MAIN ── */
    .e-main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px;
      text-align: center;
    }

    /* ── 404 NUMBER ── */
    .e-code {
      font-family: var(--font-head);
      font-size: clamp(8rem, 28vw, 22rem);
      line-height: .85;
      letter-spacing: .04em;
      color: var(--neon);
      text-shadow:
        0 0 40px var(--neon-glow),
        0 0 120px rgba(232,255,0,.12);
      user-select: none;
      margin-bottom: 4px;
    }

    /* ── SUBTITLE ── */
    .e-subtitle {
      font-family: var(--font-head);
      font-size: clamp(1.2rem, 4vw, 2.6rem);
      letter-spacing: .12em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── DIVIDER ── */
    .e-divider {
      width: 60px;
      height: 3px;
      background: var(--neon);
      border-radius: 2px;
      margin: 0 auto 28px;
    }

    /* ── MESSAGE ── */
    .e-message {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 44px;
    }

    /* ── BUTTONS ── */
    .e-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .e-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      font-family: var(--font-sub);
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      border-radius: 3px;
      text-decoration: none;
      transition: opacity .2s, transform .15s;
      cursor: pointer;
    }
    .e-btn:hover { opacity: .85; transform: translateY(-1px); }
    .e-btn:active { transform: translateY(0); }

    .e-btn-primary {
      background: var(--neon);
      color: var(--black);
    }

    .e-btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .e-btn-secondary:hover {
      border-color: var(--neon);
      color: var(--neon);
      opacity: 1;
    }

    /* ── FOOTER ── */
    .e-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--border);
      font-family: var(--font-sub);
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .e-footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color .2s;
    }
    .e-footer a:hover { color: var(--neon); }

    .e-footer-sep {
      margin: 0 10px;
      opacity: .4;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .e-nav { padding: 0 20px; }
      .e-actions { flex-direction: column; align-items: stretch; }
      .e-btn { justify-content: center; }
    }
  </style>
</head>
<body>

<!-- ── NAV ─────────────────────────────────────────────────── -->
<nav class="e-nav">
  <a href="/" class="e-logo">WEAR<span>IT</span></a>
</nav>

<!-- ── MAIN ─────────────────────────────────────────────────── -->
<main class="e-main">
  <div class="e-code">404</div>
  <p class="e-subtitle">Page Not Found</p>
  <div class="e-divider"></div>
  <p class="e-message">Looks like this page got lost in the print queue. The URL you followed might be outdated or the page may have moved. Let's get you back on track.</p>
  <div class="e-actions">
    <a href="/" class="e-btn e-btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Back to Homepage
    </a>
    <a href="editor.html" class="e-btn e-btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Open Design Editor
    </a>
  </div>
</main>

<!-- ── FOOTER ────────────────────────────────────────────────── -->
<footer class="e-footer">
  <a href="/">Home</a>
  <span class="e-footer-sep">·</span>
  <a href="privacy.html">Privacy</a>
  <span class="e-footer-sep">·</span>
  <a href="terms.html">Terms</a>
  <span class="e-footer-sep">·</span>
  <a href="returns.html">Returns</a>
  <span class="e-footer-sep">·</span>
  <a href="mailto:support@wearit.com">Support</a>
</footer>

</body>
</html>
