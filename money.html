<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>904 Garage Doors — Money Buckets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="robots" content="noindex" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #080808; --dark: #111; --card: #161616; --card2: #1c1c1c; --border: #232323;
      --gold: #c8a96e; --gold-glow: rgba(200,169,110,0.15);
      --white: #f5f5f5; --grey: #777; --grey2: #999;
      --green: #2ecc71; --green-dim: rgba(46,204,113,0.12);
      --red: #e63946; --red-dim: rgba(230,57,70,0.12);
      --orange: #f97316; --orange-dim: rgba(249,115,22,0.12);
      --blue: #3b82f6; --blue-dim: rgba(59,130,246,0.12);
      --purple: #a855f7; --purple-dim: rgba(168,85,247,0.12);
      --yellow: #eab308;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black); color: var(--white); font-family: 'Inter', sans-serif;
      min-height: 100vh; padding: 1.5rem 1rem 4rem; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    /* HEADER */
    .header { text-align: center; margin-bottom: 1.5rem; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 0.15rem; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 9vw, 3rem); letter-spacing: 0.04em; line-height: 1; margin: 0.4rem 0 0.2rem; }
    .subtitle { font-size: 0.8rem; color: var(--grey); }
    .back-link { display: inline-block; margin-top: 0.6rem; font-size: 0.72rem; color: var(--grey2); text-decoration: none; border-bottom: 1px dotted var(--grey); }
    .back-link:hover { color: var(--gold); }

    /* ALERTS */
    .alerts { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .alert {
      border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.82rem; font-weight: 600;
      display: flex; align-items: center; gap: 0.6rem; border: 1px solid;
    }
    .alert.red { background: var(--red-dim); border-color: rgba(230,57,70,0.35); color: #ff8a93; }
    .alert.orange { background: var(--orange-dim); border-color: rgba(249,115,22,0.35); color: #ffb37a; }
    .alert.blue { background: var(--blue-dim); border-color: rgba(59,130,246,0.35); color: #8fb8ff; }
    .alert.green { background: var(--green-dim); border-color: rgba(46,204,113,0.35); color: #8be8ad; }
    .alert-icon { font-size: 1.1rem; }

    /* CARDS */
    .card { background: var(--dark); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--grey); margin-bottom: 0.75rem; }

    /* THIS WEEK SUMMARY */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; text-align: center; }
    .summary-item .val { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; line-height: 1; }
    .summary-item .lbl { font-size: 0.62rem; color: var(--grey); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.3rem; }
    .summary-item .val.gold { color: var(--gold); }
    .summary-item .val.green { color: var(--green); }
    .summary-item .val.red { color: var(--red); }

    /* BIG ACTION BUTTON */
    .btn {
      display: block; width: 100%; padding: 1rem; border-radius: 12px; border: none;
      font-family: 'Inter', sans-serif; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.04em;
      cursor: pointer; text-align: center; text-transform: uppercase; transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--gold), #e2c98a); color: #1a1408; margin-bottom: 1rem; }
    .btn-secondary { background: var(--card2); color: var(--white); border: 1px solid var(--border); }
    .btn-danger-outline { background: none; color: var(--red); border: 1px solid rgba(230,57,70,0.4); }
    .btn-small {
      padding: 0.55rem 0.9rem; font-size: 0.7rem; border-radius: 8px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--border);
      background: var(--card2); color: var(--white); cursor: pointer; white-space: nowrap;
    }
    .btn-small:hover { border-color: var(--gold); color: var(--gold); }

    /* BUCKETS */
    .buckets-heading { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--grey); margin: 1.5rem 0 0.75rem; }
    .buckets-grid { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
    @media (min-width: 540px) { .buckets-grid { grid-template-columns: 1fr 1fr; } }

    .bucket {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem;
      border-left: 4px solid var(--bucket-color, var(--gold));
      transition: border-color 0.2s;
    }
    .bucket.locked { border-color: rgba(230,57,70,0.5); }
    .bucket-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .bucket-icon { font-size: 1.4rem; }
    .bucket-name { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey2); flex: 1; }
    .bucket-status { font-size: 1rem; }
    .bucket-balance { font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; line-height: 1; color: var(--white); margin-bottom: 0.5rem; }
    .bucket-balance.zero { color: var(--red); }
    .bucket-gauge { height: 14px; background: var(--card2); border-radius: 7px; overflow: hidden; margin-bottom: 0.4rem; border: 1px solid var(--border); }
    .bucket-gauge-fill { height: 100%; border-radius: 7px; transition: width 0.4s ease; background: var(--bucket-color, var(--gold)); }
    .bucket-gauge-fill.warn { background: var(--red) !important; }
    .bucket-target { font-size: 0.68rem; color: var(--grey); margin-bottom: 0.75rem; }
    .bucket-warn-text { font-size: 0.68rem; color: var(--red); font-weight: 700; margin-bottom: 0.6rem; }

    .bucket-spend { display: flex; gap: 0.4rem; }
    .bucket-spend input {
      flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--white); font-size: 0.8rem; padding: 0.55rem 0.6rem; outline: none; font-family: 'Inter', sans-serif;
    }
    .bucket-spend input:focus { border-color: var(--bucket-color, var(--gold)); }
    .bucket-spend button {
      background: var(--card2); border: 1px solid var(--border); color: var(--white);
      border-radius: 8px; font-size: 0.75rem; font-weight: 700; padding: 0.55rem 0.8rem; cursor: pointer; white-space: nowrap;
    }
    .bucket-spend button:hover { border-color: var(--bucket-color, var(--gold)); color: var(--bucket-color, var(--gold)); }
    .bucket.locked .bucket-spend button { opacity: 0.4; cursor: not-allowed; }

    /* PROGRESS BAR (debt / emergency) */
    .progress-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 0.5rem; }
    .progress-row .num { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; }
    .progress-bar { height: 12px; background: var(--card2); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 0.85rem; }
    .progress-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }

    /* INLINE FORM ROWS */
    .form-row { display: flex; gap: 0.5rem; }
    .form-row input {
      flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--white); font-size: 0.85rem; padding: 0.6rem 0.7rem; outline: none; font-family: 'Inter', sans-serif;
    }
    .form-row input:focus { border-color: var(--gold); }

    /* HISTORY */
    .history-item {
      display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0;
      border-bottom: 1px solid var(--border); font-size: 0.78rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item .hi-date { color: var(--grey2); font-weight: 600; }
    .history-item .hi-income { color: var(--green); font-weight: 700; }
    .history-empty { font-size: 0.78rem; color: var(--grey); text-align: center; padding: 0.5rem 0; }

    /* SETTINGS */
    details.settings { background: var(--dark); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; }
    details.settings summary {
      cursor: pointer; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--grey); list-style: none;
    }
    details.settings summary::-webkit-details-marker { display: none; }
    details.settings summary::after { content: ' ▾'; }
    details.settings[open] summary::after { content: ' ▴'; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .settings-row:last-of-type { border-bottom: none; }
    .settings-row label { font-size: 0.8rem; color: var(--grey2); }
    .settings-row input {
      width: 90px; text-align: right; background: var(--card2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--white); font-size: 0.85rem; padding: 0.4rem 0.6rem; outline: none; font-family: 'Inter', sans-serif;
    }
    .settings-row input:focus { border-color: var(--gold); }
    .settings-total { font-size: 0.72rem; color: var(--grey); margin-top: 0.75rem; text-align: right; }
    .settings-total.bad { color: var(--red); font-weight: 700; }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center; z-index: 200; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--dark); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.5rem; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
    }
    .modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.04em; margin-bottom: 1rem; color: var(--gold); }
    .modal-input {
      width: 100%; background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--white); font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; text-align: center;
      padding: 0.75rem; outline: none; margin-bottom: 1rem;
    }
    .modal-input:focus { border-color: var(--gold); }
    .breakdown { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; }
    .breakdown-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.4rem 0.6rem; background: var(--card2); border-radius: 8px; }
    .breakdown-row .bk-name { display: flex; align-items: center; gap: 0.5rem; color: var(--grey2); }
    .breakdown-row .bk-amt { font-weight: 700; color: var(--white); }
    .breakdown-row.tax .bk-amt { color: var(--orange); }
    .modal-actions { display: flex; gap: 0.6rem; }
    .modal-actions .btn { margin-bottom: 0; }
    .modal-close { background: none; border: none; color: var(--grey); font-size: 0.75rem; text-decoration: underline; cursor: pointer; display: block; margin: 0.75rem auto 0; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">904 GARAGE DOORS</div>
    <div class="title">Money Buckets</div>
    <div class="subtitle">Every dollar has a job. Spend from the right bucket.</div>
    <a class="back-link" href="/adhd.html">← Command Post</a>
  </div>

  <div class="alerts" id="alerts"></div>

  <!-- THIS WEEK SUMMARY -->
  <div class="card">
    <div class="card-label">This Week</div>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="val gold" id="sumIncome">$0</div>
        <div class="lbl">Income In</div>
      </div>
      <div class="summary-item">
        <div class="val" id="sumSpent">$0</div>
        <div class="lbl">Spent</div>
      </div>
      <div class="summary-item">
        <div class="val green" id="sumFree">$0</div>
        <div class="lbl">Free Right Now</div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="openIncomeModal()">+ Log This Week's Pay</button>

  <!-- BUCKETS -->
  <div class="buckets-heading">Your Buckets</div>
  <div class="buckets-grid" id="bucketsGrid"></div>

  <!-- TAX HOLD -->
  <div class="card" style="border-left:4px solid var(--orange);">
    <div class="card-label">🧾 Tax Hold — Don't Touch</div>
    <div class="bucket-balance" id="taxBalance">$0</div>
    <div class="bucket-target" id="taxNote"></div>
  </div>

  <!-- MANAGER DEBT -->
  <div class="card" style="border-left:4px solid var(--purple);">
    <div class="card-label">🔧 Manager Debt</div>
    <div class="progress-row">
      <span>Owed: <span class="num" id="debtRemaining">$0</span></span>
      <span style="color:var(--grey);">of <span id="debtTotal">$0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="debtFill" style="background:var(--purple);"></div></div>
    <div class="form-row">
      <input type="number" id="debtPayInput" placeholder="Repayment amount" min="0" step="1" inputmode="decimal">
      <button class="btn-small" onclick="logRepayment()">Log Repayment</button>
    </div>
  </div>

  <!-- FRIDAY CHECK-IN -->
  <div class="card">
    <div class="card-label">📅 Friday Check-In</div>
    <div id="historyList"></div>
    <button class="btn btn-secondary" style="margin-top:0.75rem;" onclick="closeOutWeek()">Close Out This Week</button>
  </div>

  <!-- SETTINGS -->
  <details class="settings">
    <summary>Settings — Buckets, Tax % &amp; Targets</summary>
    <div class="settings-row">
      <label>Average weekly income (for gauges)</label>
      <input type="number" id="setBaseline" min="0" step="1" inputmode="decimal">
    </div>
    <div class="settings-row">
      <label>Tax hold %</label>
      <input type="number" id="setTaxPct" min="0" max="100" step="1" inputmode="decimal">
    </div>
    <div id="settingsBuckets"></div>
    <div class="settings-row">
      <label>Emergency fund goal ($)</label>
      <input type="number" id="setEmergencyTarget" min="0" step="1" inputmode="decimal">
    </div>
    <div class="settings-row">
      <label>Fuel low warning (&lt; $)</label>
      <input type="number" id="setFuelWarn" min="0" step="1" inputmode="decimal">
    </div>
    <div class="settings-row">
      <label>Manager debt low warning (&lt; $)</label>
      <input type="number" id="setPartsWarn" min="0" step="1" inputmode="decimal">
    </div>
    <div class="settings-row">
      <label>Total owed to manager ($)</label>
      <input type="number" id="setDebtTotal" min="0" step="1" inputmode="decimal">
    </div>
    <div class="settings-row">
      <label>Currently still owed ($)</label>
      <input type="number" id="setDebtRemaining" min="0" step="1" inputmode="decimal">
    </div>
    <div class="settings-total" id="settingsTotal"></div>
  </details>

  <button class="btn btn-danger-outline" onclick="resetEverything()">Reset All Data</button>

</div>

<!-- INCOME MODAL -->
<div class="modal-overlay" id="incomeModal">
  <div class="modal">
    <h2>Log This Week's Pay</h2>
    <input type="number" class="modal-input" id="incomeInput" placeholder="$0" min="0" step="1" inputmode="decimal" oninput="renderIncomePreview()">
    <div class="breakdown" id="incomeBreakdown"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1;" onclick="closeIncomeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;margin-bottom:0;" onclick="confirmIncome()">Split It Up</button>
    </div>
  </div>
</div>

<script>
'use strict';

const STORE_KEY = 'moneyTracker_v1';

function defaultData() {
  return {
    settings: {
      baselineIncome: 1800,
      taxPct: 20,
      emergencyTarget: 1000,
      fuelWarn: 50,
      partsWarn: 100,
    },
    buckets: [
      { id: 'household', icon: '🏠', name: 'Household Bills',     pct: 15, color: 'var(--blue)',   balance: 0 },
      { id: 'fuel',      icon: '⛽', name: 'Fuel',                 pct: 20, color: 'var(--orange)', balance: 0 },
      { id: 'parts',     icon: '🔧', name: 'Parts / Manager Debt', pct: 15, color: 'var(--purple)', balance: 0 },
      { id: 'emergency', icon: '🔥', name: 'Emergency Fund',       pct: 10, color: 'var(--red)',    balance: 0 },
      { id: 'savings',   icon: '📈', name: 'Savings / Growth',     pct: 10, color: 'var(--green)',  balance: 0 },
      { id: 'personal',  icon: '🎯', name: 'Personal / Free',      pct: 10, color: 'var(--gold)',   balance: 0 },
    ],
    taxHold: { balance: 0 },
    managerDebt: { total: 2000, remaining: 2000 },
    week: { incomeLogged: 0, spent: {}, startedAt: new Date().toISOString() },
    history: [],
  };
}

function getData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    if (!parsed.buckets || !parsed.settings) return defaultData();
    return parsed;
  } catch { return defaultData(); }
}

function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

let data = getData();

// ── HELPERS ──────────────────────────────────────────────────────────────
function fmt(n) { return '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function bucketById(id) { return data.buckets.find(b => b.id === id); }
function weeklyTarget(b) { return data.settings.baselineIncome * b.pct / 100; }

// ── INCOME MODAL ─────────────────────────────────────────────────────────
function openIncomeModal() {
  document.getElementById('incomeInput').value = '';
  document.getElementById('incomeBreakdown').innerHTML = '';
  document.getElementById('incomeModal').classList.add('open');
  setTimeout(() => document.getElementById('incomeInput').focus(), 50);
}
function closeIncomeModal() { document.getElementById('incomeModal').classList.remove('open'); }

function renderIncomePreview() {
  const gross = parseFloat(document.getElementById('incomeInput').value) || 0;
  const el = document.getElementById('incomeBreakdown');
  if (gross <= 0) { el.innerHTML = ''; return; }
  const taxAmt = gross * data.settings.taxPct / 100;
  let rows = `<div class="breakdown-row tax"><span class="bk-name">🧾 Tax Hold (${data.settings.taxPct}%)</span><span class="bk-amt">${fmt(taxAmt)}</span></div>`;
  data.buckets.forEach(b => {
    const amt = gross * b.pct / 100;
    rows += `<div class="breakdown-row"><span class="bk-name">${b.icon} ${b.name} (${b.pct}%)</span><span class="bk-amt">${fmt(amt)}</span></div>`;
  });
  el.innerHTML = rows;
}

function confirmIncome() {
  const gross = parseFloat(document.getElementById('incomeInput').value) || 0;
  if (gross <= 0) return;
  const taxAmt = gross * data.settings.taxPct / 100;
  data.taxHold.balance += taxAmt;
  data.buckets.forEach(b => { b.balance += gross * b.pct / 100; });
  data.week.incomeLogged += gross;
  saveData();
  closeIncomeModal();
  render();
}

// ── SPEND ────────────────────────────────────────────────────────────────
function spendFromBucket(id) {
  const input = document.getElementById('spend-' + id);
  const amt = parseFloat(input.value);
  if (!amt || amt <= 0) return;
  const b = bucketById(id);
  if (amt > b.balance) {
    alert(`Not enough in ${b.name}. You only have ${fmt(b.balance)} left — this bucket is locked at zero, so it can't go negative.`);
    return;
  }
  if (!confirm(`Spend ${fmt(amt)} from ${b.icon} ${b.name}?`)) return;
  b.balance -= amt;
  data.week.spent[id] = (data.week.spent[id] || 0) + amt;
  input.value = '';
  saveData();
  render();
}

// ── MANAGER DEBT ─────────────────────────────────────────────────────────
function logRepayment() {
  const input = document.getElementById('debtPayInput');
  const amt = parseFloat(input.value);
  if (!amt || amt <= 0) return;
  const parts = bucketById('parts');
  if (amt > parts.balance) {
    alert(`Not enough in your Parts / Manager Debt bucket. You only have ${fmt(parts.balance)} left.`);
    return;
  }
  if (!confirm(`Send ${fmt(amt)} to your manager from the Parts / Manager Debt bucket?`)) return;
  parts.balance -= amt;
  data.week.spent['parts'] = (data.week.spent['parts'] || 0) + amt;
  data.managerDebt.remaining = Math.max(0, data.managerDebt.remaining - amt);
  input.value = '';
  saveData();
  render();
}

// ── WEEKLY CLOSE-OUT ─────────────────────────────────────────────────────
function closeOutWeek() {
  if (data.week.incomeLogged === 0 && Object.keys(data.week.spent).length === 0) {
    alert('Nothing logged yet this week.');
    return;
  }
  if (!confirm('Close out this week? This saves a snapshot to your history and starts a fresh weekly count (your bucket balances stay the same).')) return;
  const totalSpent = Object.values(data.week.spent).reduce((s, v) => s + v, 0);
  data.history.unshift({
    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
    income: data.week.incomeLogged,
    spent: totalSpent,
    free: bucketById('personal').balance,
  });
  data.history = data.history.slice(0, 8);
  data.week = { incomeLogged: 0, spent: {}, startedAt: new Date().toISOString() };
  saveData();
  render();
}

// ── RESET ────────────────────────────────────────────────────────────────
function resetEverything() {
  if (!confirm('Reset ALL money data — buckets, history, settings? This cannot be undone.')) return;
  data = defaultData();
  saveData();
  render();
}

// ── SETTINGS ─────────────────────────────────────────────────────────────
function bindSettings() {
  document.getElementById('setBaseline').value = data.settings.baselineIncome;
  document.getElementById('setTaxPct').value = data.settings.taxPct;
  document.getElementById('setEmergencyTarget').value = data.settings.emergencyTarget;
  document.getElementById('setFuelWarn').value = data.settings.fuelWarn;
  document.getElementById('setPartsWarn').value = data.settings.partsWarn;
  document.getElementById('setDebtTotal').value = data.managerDebt.total;
  document.getElementById('setDebtRemaining').value = data.managerDebt.remaining;

  const wrap = document.getElementById('settingsBuckets');
  wrap.innerHTML = '';
  data.buckets.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'settings-row';
    row.innerHTML = `<label>${b.icon} ${b.name} %</label>`;
    const input = document.createElement('input');
    input.type = 'number'; input.min = '0'; input.max = '100'; input.step = '1';
    input.value = b.pct;
    input.oninput = () => { b.pct = Math.max(0, parseFloat(input.value) || 0); saveData(); render(); };
    row.appendChild(input);
    wrap.appendChild(row);
  });

  document.getElementById('setBaseline').oninput = (e) => { data.settings.baselineIncome = Math.max(0, parseFloat(e.target.value) || 0); saveData(); render(); };
  document.getElementById('setTaxPct').oninput = (e) => { data.settings.taxPct = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0)); saveData(); render(); };
  document.getElementById('setEmergencyTarget').oninput = (e) => { data.settings.emergencyTarget = Math.max(0, parseFloat(e.target.value) || 0); saveData(); render(); };
  document.getElementById('setFuelWarn').oninput = (e) => { data.settings.fuelWarn = Math.max(0, parseFloat(e.target.value) || 0); saveData(); render(); };
  document.getElementById('setPartsWarn').oninput = (e) => { data.settings.partsWarn = Math.max(0, parseFloat(e.target.value) || 0); saveData(); render(); };
  document.getElementById('setDebtTotal').oninput = (e) => { data.managerDebt.total = Math.max(0, parseFloat(e.target.value) || 0); saveData(); render(); };
  document.getElementById('setDebtRemaining').oninput = (e) => { data.managerDebt.remaining = Math.max(0, parseFloat(e.target.value) || 0); saveData(); render(); };
}

// ── RENDER ───────────────────────────────────────────────────────────────
function render() {
  // Summary
  const totalSpent = Object.values(data.week.spent).reduce((s, v) => s + v, 0);
  document.getElementById('sumIncome').textContent = fmt(data.week.incomeLogged);
  document.getElementById('sumSpent').textContent = fmt(totalSpent);
  const free = bucketById('personal').balance;
  const freeEl = document.getElementById('sumFree');
  freeEl.textContent = fmt(free);
  freeEl.className = 'val ' + (free <= 0 ? 'red' : 'green');

  // Alerts
  const alerts = [];
  const fuel = bucketById('fuel');
  const parts = bucketById('parts');
  const emergency = bucketById('emergency');
  if (fuel.balance <= 0) alerts.push({ type: 'red', icon: '🔒', text: 'Fuel bucket is empty — locked. Don\'t spend on gas until next week\'s income is logged.' });
  else if (fuel.balance < data.settings.fuelWarn) alerts.push({ type: 'red', icon: '⛽', text: `Fuel is almost empty — only ${fmt(fuel.balance)} left.` });

  if (parts.balance <= 0) alerts.push({ type: 'orange', icon: '🔒', text: 'Parts / Manager Debt bucket is empty — locked.' });
  else if (parts.balance < data.settings.partsWarn) alerts.push({ type: 'orange', icon: '🔧', text: `Low on manager repayment funds — only ${fmt(parts.balance)} left.` });

  if (emergency.balance < data.settings.emergencyTarget) {
    alerts.push({ type: 'blue', icon: '🔥', text: `Emergency fund: ${fmt(emergency.balance)} of ${fmt(data.settings.emergencyTarget)} goal. Keep it growing.` });
  } else {
    alerts.push({ type: 'green', icon: '🔥', text: `Emergency fund goal reached — ${fmt(emergency.balance)}!` });
  }

  data.buckets.forEach(b => {
    if (b.id !== 'fuel' && b.id !== 'parts' && b.balance <= 0) {
      alerts.push({ type: 'red', icon: '🔒', text: `${b.icon} ${b.name} is at $0 — locked until next income.` });
    }
  });

  document.getElementById('alerts').innerHTML = alerts.map(a =>
    `<div class="alert ${a.type}"><span class="alert-icon">${a.icon}</span><span>${a.text}</span></div>`
  ).join('');

  // Buckets
  const grid = document.getElementById('bucketsGrid');
  grid.innerHTML = '';
  data.buckets.forEach(b => {
    let pctFull, targetLabel;
    if (b.id === 'emergency') {
      pctFull = data.settings.emergencyTarget > 0 ? (b.balance / data.settings.emergencyTarget) * 100 : 0;
      targetLabel = `Goal: ${fmt(b.balance)} of ${fmt(data.settings.emergencyTarget)}`;
    } else {
      const target = weeklyTarget(b);
      pctFull = target > 0 ? (b.balance / target) * 100 : 0;
      targetLabel = `Weekly target: ${fmt(target)} (${b.pct}% of avg pay)`;
    }
    const locked = b.balance <= 0;
    let warnText = '';
    if (b.id === 'fuel' && b.balance > 0 && b.balance < data.settings.fuelWarn) warnText = '⚠ Running low on gas money';
    if (b.id === 'parts' && b.balance > 0 && b.balance < data.settings.partsWarn) warnText = '⚠ Running low on manager repayment';

    const div = document.createElement('div');
    div.className = 'bucket' + (locked ? ' locked' : '');
    div.style.setProperty('--bucket-color', b.color);
    div.innerHTML = `
      <div class="bucket-head">
        <span class="bucket-icon">${b.icon}</span>
        <span class="bucket-name">${b.name}</span>
        <span class="bucket-status">${locked ? '🔒' : (warnText ? '⚠️' : '🟢')}</span>
      </div>
      <div class="bucket-balance${locked ? ' zero' : ''}">${fmt(b.balance)}</div>
      <div class="bucket-gauge"><div class="bucket-gauge-fill${locked || warnText ? ' warn' : ''}" style="width:${Math.max(0, Math.min(pctFull, 100))}%;"></div></div>
      <div class="bucket-target">${targetLabel}</div>
      ${warnText ? `<div class="bucket-warn-text">${warnText}</div>` : ''}
      <div class="bucket-spend">
        <input type="number" id="spend-${b.id}" placeholder="${locked ? 'Locked — $0 left' : 'Amount spent'}" min="0" step="0.01" inputmode="decimal" ${locked ? 'disabled' : ''}>
        <button onclick="spendFromBucket('${b.id}')" ${locked ? 'disabled' : ''}>− Spend</button>
      </div>
    `;
    grid.appendChild(div);
    const inp = div.querySelector(`#spend-${b.id}`);
    if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') spendFromBucket(b.id); });
  });

  // Tax hold
  document.getElementById('taxBalance').textContent = fmt(data.taxHold.balance);
  document.getElementById('taxNote').textContent = `Set aside at ${data.settings.taxPct}% of every paycheck. Keep this for tax season — never spend it.`;

  // Manager debt
  document.getElementById('debtRemaining').textContent = fmt(data.managerDebt.remaining);
  document.getElementById('debtTotal').textContent = fmt(data.managerDebt.total);
  const debtPctPaid = data.managerDebt.total > 0
    ? ((data.managerDebt.total - data.managerDebt.remaining) / data.managerDebt.total) * 100
    : 100;
  document.getElementById('debtFill').style.width = Math.max(0, Math.min(debtPctPaid, 100)) + '%';

  // History
  const histEl = document.getElementById('historyList');
  if (data.history.length === 0) {
    histEl.innerHTML = '<div class="history-empty">No weeks closed out yet. Hit "Close Out This Week" on Friday.</div>';
  } else {
    histEl.innerHTML = data.history.map(h =>
      `<div class="history-item"><span class="hi-date">${h.date}</span><span class="hi-income">+${fmt(h.income)} in</span><span>${fmt(h.spent)} spent</span><span>${fmt(h.free)} free</span></div>`
    ).join('');
  }

  // Settings totals
  const totalPct = data.buckets.reduce((s, b) => s + b.pct, 0) + data.settings.taxPct;
  const totalEl = document.getElementById('settingsTotal');
  totalEl.textContent = `Buckets + tax = ${Math.round(totalPct)}% of income${totalPct !== 100 ? ' — should add up to 100%' : ' ✓'}`;
  totalEl.className = 'settings-total' + (totalPct !== 100 ? ' bad' : '');
}

bindSettings();
render();
</script>
</body>
</html>
