name: Deploy to SiteGround

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p deploy
          cp 904garage.html deploy/index.html
          cp garage-door-repair-*.html deploy/
          cp garage-door-spring-repair-jacksonville.html deploy/
          cp emergency-garage-door-repair-jacksonville.html deploy/
          cp garage-door-opener-repair-jacksonville.html deploy/
          cp sitemap.xml robots.txt 404.html adhd.html daily.html deploy/
          cp hero-video.mp4 deploy/
          cp hero-mobile.jpg deploy/
          cp siteground-upload/.htaccess deploy/
          find deploy/ -name "*.html" -exec sed -i "s|fetch('/api/contact'|fetch('https://nine04-garage-doors.onrender.com/api/contact'|g" {} \;

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftp
          local-dir: ./deploy/
          server-dir: public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-v5.json
